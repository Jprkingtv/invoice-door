<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1633">
<title>JPR KING Invoicing</title>
<style>
:root{
  --navy:#0a1633; --navy2:#1b2f63; --gold:#d4af37; --gold2:#f0cd55; --gold3:#c39a2b;
  --cream:#f5eeda; --ink:#10131c; --mut:#9fb0d8; --line:rgba(212,175,55,.35);
  --glass:linear-gradient(180deg,rgba(212,175,55,.09),rgba(10,22,51,.72) 42%);
  --red:#e06c5b; --green:#7fc97f; --green2:#5fd35f; --red2:#ff8a76;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--cream);min-height:100vh;position:relative;
  background:
    radial-gradient(1000px 520px at 85% -5%,rgba(212,175,55,.17) 0%,rgba(212,175,55,0) 55%),
    radial-gradient(760px 520px at 6% 24%,rgba(43,80,175,.38) 0%,rgba(43,80,175,0) 60%),
    radial-gradient(1300px 720px at 50% -10%,#223a7d 0%,#0c1a3d 52%,#060d22 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
/* faint gold diamond lattice over the palace navy */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(45deg,rgba(212,175,55,.055) 1px,transparent 1px),
    linear-gradient(-45deg,rgba(212,175,55,.055) 1px,transparent 1px);
  background-size:26px 26px;
}
h1,h2,h3{font-family:var(--serif)}
a{color:var(--gold2)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--cream);background:linear-gradient(180deg,rgba(5,10,25,.92),rgba(13,24,54,.92));border:1px solid rgba(212,175,55,.42);border-radius:12px;padding:11px 12px;width:100%;min-height:44px;box-shadow:inset 0 2px 9px rgba(0,0,0,.55),inset 0 1px 0 rgba(240,205,85,.10)}
input::placeholder,textarea::placeholder{color:#7e8fb8}
select option{color:var(--ink);background:#fdfaf0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.35),inset 0 2px 9px rgba(0,0,0,.55)}
label{display:block;font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin:13px 0 5px}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 118px;position:relative;z-index:1}
/* ---------- compact top bar ---------- */
.topbar{position:relative;display:flex;align-items:center;gap:13px;padding:12px 14px;margin-top:6px;border:1px solid rgba(212,175,55,.55);border-radius:18px;background:linear-gradient(160deg,rgba(31,54,112,.90),rgba(10,22,51,.94) 60%);box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 24px rgba(212,175,55,.13),inset 0 1px 0 rgba(240,205,85,.35);overflow:hidden}
.topbar::after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:45%;background:linear-gradient(100deg,rgba(240,205,85,0) 0%,rgba(240,205,85,.12) 50%,rgba(240,205,85,0) 100%);transform:skewX(-18deg);animation:sweep 8s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,55%{left:-35%}85%,100%{left:110%}}
.medallion{flex:none;width:56px;height:56px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#7a5f18,var(--gold2),var(--gold),#7a5f18,var(--gold2),var(--gold),#7a5f18);box-shadow:0 0 22px rgba(212,175,55,.55),0 5px 14px rgba(0,0,0,.5)}
.medallion img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:2px solid rgba(10,22,51,.65)}
.topbar .tt{min-width:0}
.topbar .tt h1{margin:0;font-size:19px;letter-spacing:2.4px;line-height:1.15;background:linear-gradient(180deg,#f7e08a 0%,var(--gold2) 45%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold2);filter:drop-shadow(0 2px 8px rgba(212,175,55,.30))}
.topbar .tt p{margin:3px 0 0;font-size:9.5px;letter-spacing:1.7px;color:var(--cream);opacity:.92}
.topbar .tt p.sub{display:none}
/* top navrow is superseded by the fixed bottom bar (kept in DOM; renderNav still fills it) */
.navrow{display:none}
.navbtn{flex:1;min-width:70px;background:rgba(10,22,51,.65);color:var(--cream);border:1px solid var(--line);border-radius:11px;padding:10px 4px;font-size:14px;letter-spacing:.6px}
.navbtn.on{background:linear-gradient(180deg,var(--gold2),var(--gold3));color:var(--navy);font-weight:bold;border-color:var(--gold)}
/* ---------- glass panels & cards ---------- */
.card,.panel{position:relative;border:1px solid rgba(212,175,55,.52);border-radius:20px;padding:20px 17px;background:linear-gradient(165deg,rgba(48,76,152,.50),rgba(16,30,66,.88) 46%,rgba(8,15,36,.95));box-shadow:0 16px 38px rgba(0,0,0,.50),0 0 28px rgba(212,175,55,.12),inset 0 1px 0 rgba(240,205,85,.32),inset 0 0 60px rgba(0,0,0,.35);margin:15px 0;overflow:hidden;animation:cardIn .28s ease both}
.card::before,.panel::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(240,205,85,.75),transparent);pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 9px;color:var(--gold2);letter-spacing:1.8px;font-size:20px;text-shadow:0 1px 8px rgba(212,175,55,.25)}
.rise{animation:riseIn .45s ease both}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ---------- home hero ---------- */
.hero{position:relative;text-align:center;padding:30px 18px 24px;margin-top:14px;border-radius:22px;border:1px solid rgba(212,175,55,.62);background:radial-gradient(430px 210px at 50% -4%,rgba(240,205,85,.24),rgba(240,205,85,0) 70%),linear-gradient(170deg,rgba(48,76,152,.55),rgba(10,20,48,.95) 58%);box-shadow:0 20px 46px rgba(0,0,0,.55),0 0 40px rgba(212,175,55,.16),inset 0 1px 0 rgba(240,205,85,.4),inset 0 0 70px rgba(0,0,0,.35);overflow:hidden;animation:riseIn .45s ease both}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:45%;background:linear-gradient(100deg,rgba(240,205,85,0) 0%,rgba(240,205,85,.13) 50%,rgba(240,205,85,0) 100%);transform:skewX(-18deg);animation:sweep 8.5s ease-in-out infinite;pointer-events:none}
.hero-medal{width:118px;height:118px;margin:2px auto 0;border-radius:50%;padding:5px;background:conic-gradient(from 210deg,#7a5f18,var(--gold2),var(--gold),#7a5f18,var(--gold2),var(--gold),#7a5f18);box-shadow:0 0 46px rgba(212,175,55,.65),0 0 0 10px rgba(212,175,55,.08),0 12px 28px rgba(0,0,0,.55)}
.hero-medal img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:2px solid rgba(10,22,51,.65)}
.hero-name{font-size:clamp(34px,9vw,44px);letter-spacing:4px;line-height:1.1;margin:17px 0 5px;background:linear-gradient(180deg,#f9e38f 0%,var(--gold2) 45%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold2);filter:drop-shadow(0 3px 14px rgba(212,175,55,.35))}
.hero-tag{margin:0;font-size:12px;font-weight:600;letter-spacing:3.2px;color:var(--cream)}
.hero-sub{margin:7px 0 0;font-size:13.5px;line-height:1.55;letter-spacing:.4px;color:var(--gold2);white-space:pre-line}
/* ---------- home stats panel ---------- */
.plabel{font-size:12px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold2)}
.bignum{font-family:var(--serif);font-weight:bold;font-size:clamp(40px,11vw,52px);line-height:1.05;color:#fff8e6;text-shadow:0 2px 20px rgba(240,205,85,.35);margin:7px 0 15px}
.substats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.substat{border:1px solid rgba(212,175,55,.45);border-radius:14px;padding:12px 5px 10px;text-align:center;background:linear-gradient(180deg,rgba(240,205,85,.08),rgba(0,0,0,.30));box-shadow:inset 0 1px 0 rgba(240,205,85,.25),inset 0 0 22px rgba(0,0,0,.25)}
.substat .sv{font-family:var(--serif);font-weight:bold;font-size:clamp(16px,4.9vw,21px);color:var(--cream)}
.substat .sv.green{color:var(--green2)}
.substat .sv.red{color:var(--red2)}
.substat .sv.gold{color:var(--gold2)}
.substat .sk{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:5px}
/* ---------- signing-page card ---------- */
.cardtitle{font-family:var(--serif);font-size:20.5px;font-weight:bold;color:var(--cream);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.livepill{margin-left:auto;background:linear-gradient(180deg,#43d977,#1f9d4d);color:#04160a;font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:1.6px;padding:5px 13px;border-radius:20px;box-shadow:0 0 16px rgba(67,217,119,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.linkchip{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(43,72,150,.65),rgba(24,44,102,.65));border:1px solid rgba(130,160,235,.5);border-radius:12px;padding:12px 13px;box-shadow:inset 0 1px 0 rgba(160,190,255,.25)}
.linkchip .lk{flex:none;font-weight:700;font-size:13.5px;color:#d7e5ff}
.linkchip .lu{font-size:13px;color:#a9c2f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- section headings ---------- */
.sect{font-family:var(--serif);font-size:23px;font-weight:bold;color:var(--cream);margin:25px 0 7px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.sectrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:25px 0 7px}
.sectrow .sect{margin:0}
.seclink{background:none;border:none;color:var(--gold2);font-size:14.5px;font-weight:600;padding:8px 2px;min-height:44px}
.countbadge{display:inline-block;vertical-align:middle;margin-left:9px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--gold2);border:1.5px solid rgba(212,175,55,.65);border-radius:9px;padding:2px 10px;background:rgba(212,175,55,.10);box-shadow:inset 0 1px 0 rgba(240,205,85,.25)}
/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;display:inline-block;background:linear-gradient(180deg,#f7e08a 0%,var(--gold2) 30%,var(--gold) 62%,var(--gold3) 100%);color:var(--navy);font-family:var(--serif);font-weight:bold;font-size:16px;letter-spacing:.7px;padding:13px 21px;border:1px solid #8a6d1f;border-radius:12px;box-shadow:0 6px 20px rgba(212,175,55,.38),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(90,68,10,.45);text-decoration:none;text-align:center;min-height:44px;transition:transform .12s ease,box-shadow .12s ease}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-80%;width:50%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));transform:skewX(-20deg);transition:left .45s ease;pointer-events:none}
.btn:hover::after,.btn:active::after{left:130%}
.btn:active{transform:translateY(1.5px) scale(.99);box-shadow:0 3px 10px rgba(212,175,55,.30),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(90,68,10,.4)}
.btn.ghost{background:linear-gradient(180deg,rgba(31,54,112,.82),rgba(10,22,51,.92));color:var(--gold2);border:1px solid rgba(212,175,55,.65);box-shadow:inset 0 1px 0 rgba(240,205,85,.22),0 4px 14px rgba(0,0,0,.3)}
.btn.ghost::after{background:linear-gradient(100deg,rgba(240,205,85,0),rgba(240,205,85,.28),rgba(240,205,85,0))}
.btn.danger{background:linear-gradient(180deg,rgba(31,54,112,.82),rgba(10,22,51,.92));color:var(--red2);border:1px solid var(--red);box-shadow:inset 0 1px 0 rgba(240,205,85,.15)}
.btn.danger::after{background:linear-gradient(100deg,rgba(224,108,91,0),rgba(224,108,91,.22),rgba(224,108,91,0))}
.btn.small{padding:9px 14px;font-size:13.5px;min-height:38px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:9px;margin:8px 0 13px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(10,22,51,.6);color:var(--cream);font-size:15.5px;letter-spacing:.6px;min-height:44px;transition:box-shadow .15s ease}
.tab.on{background:linear-gradient(180deg,#f7e08a,var(--gold2) 35%,var(--gold3));color:var(--navy);font-weight:bold;border-color:#8a6d1f;box-shadow:0 5px 16px rgba(212,175,55,.35),inset 0 1px 0 rgba(255,255,255,.6)}
/* ---------- list rows ---------- */
.rowitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:linear-gradient(165deg,rgba(48,76,152,.45),rgba(10,20,48,.88));border:1px solid rgba(212,175,55,.42);border-left:4px solid var(--gold);border-radius:15px;padding:14px;margin:9px 0;color:var(--cream);box-shadow:0 8px 20px rgba(0,0,0,.38),inset 0 1px 0 rgba(240,205,85,.18);min-height:44px;transition:transform .12s ease,box-shadow .12s ease}
button.rowitem:active{transform:scale(.992)}
.rowitem .grow{flex:1;min-width:0}
.rowitem .t1{font-family:var(--serif);font-size:17px;font-weight:bold;color:#fff3d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .t2{display:block;font-size:13px;color:var(--cream);opacity:.78;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .t3{display:block;font-size:12.5px;font-weight:700;letter-spacing:.4px;margin-top:3px}
.rowitem .t3.paidup{color:var(--green2)}
.rowitem .t3.owes{color:var(--red2)}
.rowitem .amt{font-family:var(--serif);font-size:17px;font-weight:bold;white-space:nowrap;text-align:right}
.rowitem .amtdate{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--mut);margin-top:3px}
.rowitem .dot{flex:none;width:10px;height:10px;border-radius:50%}
.rowitem .dot.gold{background:var(--gold2);box-shadow:0 0 10px rgba(240,205,85,.85)}
.rowitem .dot.bad{background:#ff6b57;box-shadow:0 0 10px rgba(255,107,87,.85)}
.rowitem .chev{flex:none;color:var(--gold2);font-family:var(--serif);font-size:24px;line-height:1}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;border:1px solid rgba(212,175,55,.55);color:#ffe9a8;background:rgba(212,175,55,.18);border-radius:20px;padding:3px 10px;margin-left:7px;vertical-align:middle}
.chip.paid{border-color:rgba(95,211,95,.6);color:#a9e6a9;background:rgba(95,211,95,.16)}
.chip.bad{border-color:rgba(255,138,118,.6);color:#ffb3a7;background:rgba(255,138,118,.15)}
/* ---------- document sheet ---------- */
.card.doc-sheet{border:2px solid var(--gold);background:linear-gradient(180deg,rgba(31,54,112,.72),rgba(10,22,51,.92) 30%);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 40px rgba(212,175,55,.18),inset 0 0 0 1px rgba(10,22,51,.9),inset 0 0 0 3.5px rgba(212,175,55,.22),inset 0 1px 0 rgba(240,205,85,.4)}
.doc-head{display:flex;gap:15px;align-items:center;padding-bottom:14px;border-bottom:1.5px solid var(--line)}
.doc-head img{width:78px;height:78px;object-fit:cover;border-radius:50%;border:2.5px solid var(--gold);box-shadow:0 0 20px rgba(212,175,55,.5)}
table.lines{width:100%;border-collapse:collapse;margin:10px 0}
table.lines th{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold2);text-align:left;border-bottom:2px solid rgba(212,175,55,.55);padding:7px 6px}
table.lines td{padding:9px 6px;border-bottom:1px solid rgba(212,175,55,.16);font-size:15px;vertical-align:top}
table.lines td.r,table.lines th.r{text-align:right;white-space:nowrap}
.totrow{display:flex;justify-content:space-between;padding:5px 2px;font-size:15.5px;font-family:var(--serif)}
.totrow.grand{border-top:2px solid var(--gold);margin-top:8px;padding-top:11px;font-size:21px;color:var(--gold2);font-weight:bold;text-shadow:0 1px 10px rgba(212,175,55,.3)}
.mut{color:var(--mut)} .small{font-size:13px} .center{text-align:center}
.terms{font-size:13.5px;line-height:1.6;opacity:.95}
.terms p{margin:7px 0}
.asis-banner{border:2px solid var(--red);color:#ffb3a7;border-radius:10px;padding:10px;text-align:center;font-weight:bold;letter-spacing:1.5px;margin:9px 0;background:rgba(224,108,91,.08)}
.sigimg{background:#fdfaf0;border:1.5px solid var(--gold);border-radius:10px;max-width:100%;padding:6px;box-shadow:0 0 0 3px rgba(212,175,55,.15)}
canvas.pad{background:#fdfaf0;border:2px dashed var(--gold3);border-radius:12px;width:100%;height:210px;touch-action:none;display:block}
.linkbox{word-break:break-all;background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.45);border-radius:10px;padding:11px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;align-items:end}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
.motto{font-family:var(--serif);color:var(--gold2);font-weight:bold;letter-spacing:3px;text-align:center;margin:22px 0 4px;font-size:14.5px;text-shadow:0 1px 10px rgba(212,175,55,.35)}
.err{background:rgba(224,108,91,.15);border:1px solid var(--red);color:#ffb3a7;border-radius:10px;padding:11px 13px;margin:10px 0;font-size:14px}
.okmsg{background:rgba(127,201,127,.13);border:1px solid var(--green);color:#cdeecd;border-radius:10px;padding:11px 13px;margin:10px 0;font-size:14px}
select.picker{margin-top:6px}
/* ---------- fixed bottom navigation ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.bottombar .bar-in{pointer-events:auto;width:100%;max-width:860px;display:flex;align-items:flex-end;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,34,74,.90),rgba(7,13,30,.97));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1.5px solid rgba(212,175,55,.55);box-shadow:0 -8px 30px rgba(0,0,0,.5),0 -1px 18px rgba(212,175,55,.12)}
.bb-btn{flex:1;background:none;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 1px 4px;font-size:9.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;border-radius:14px;min-height:52px;transition:color .15s ease,transform .1s ease,background .15s ease,box-shadow .15s ease}
.bb-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bb-btn.on{color:var(--gold2);background:linear-gradient(180deg,rgba(240,205,85,.22),rgba(212,175,55,.07));box-shadow:inset 0 0 0 1px rgba(212,175,55,.5),0 0 16px rgba(212,175,55,.20);text-shadow:0 0 12px rgba(240,205,85,.6)}
.bb-btn.on svg{filter:drop-shadow(0 0 6px rgba(240,205,85,.75))}
.bb-btn:active{transform:scale(.94)}
.bb-new{flex:none;width:58px;height:58px;border-radius:50%;border:1.5px solid #8a6d1f;background:linear-gradient(180deg,#f7e08a,var(--gold2) 35%,var(--gold3));color:var(--navy);font-size:31px;font-family:var(--serif);line-height:1;display:flex;align-items:center;justify-content:center;transform:translateY(-13px);box-shadow:0 8px 22px rgba(212,175,55,.5),inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(90,68,10,.4);transition:transform .12s ease}
.bb-new:active{transform:translateY(-13px) scale(.93)}
/* ---------- bottom sheets (New / More) ---------- */
.sheet{position:fixed;inset:0;z-index:70;display:none;justify-content:center}
.sheet.open{display:flex}
.sheet .scrim{position:absolute;inset:0;background:rgba(3,6,15,.55)}
.sheet .panel{position:relative;width:100%;max-width:860px;margin-top:auto;background:linear-gradient(180deg,rgba(27,47,99,.97),rgba(8,15,36,.99));border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.6);animation:sheetIn .25s ease both}
@keyframes sheetIn{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 13px;color:var(--gold2);letter-spacing:1.8px;font-size:15.5px;text-align:center}
.sheet .srow{display:flex;flex-direction:column;gap:9px}
.sheet .btn{width:100%}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  body{background:#fff;color:#000}
  body::before{display:none}
  .no-print{display:none!important}
  .wrap{padding:0;max-width:none}
  .card.doc-sheet{border:1px solid #888;box-shadow:none;background:#fff;color:#000}
  .card.doc-sheet *{color:#000!important;border-color:#bbb!important}
  .card.doc-sheet .chip{border-color:#555!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="medallion"><img src="https://invoice.jprkingtv.store/logo.jpg" alt="JPR KING — Sales, Auto Repair, Autobody"></div>
    <div class="tt">
      <h1>JPR KING INVOICING</h1>
      <p>SALES &bull; AUTO REPAIR &bull; AUTOBODY &mdash; FORT LAUDERDALE</p>
      <p class="sub">837 NW 8th Ave &bull; (941) 270-4988 &mdash; ask for JAY</p>
    </div>
  </div>
  <div class="navrow no-print" id="navrow"></div>
  <div id="app"></div>
  <p class="motto">GOD IS GOOD ALL THE TIME</p>
</div>
<nav class="bottombar no-print" id="bottombar"><div class="bar-in">
  <button class="bb-btn" data-bb="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M10 19v-5h4v5"/></svg><span>Home</span></button>
  <button class="bb-btn" data-bb="estimates" onclick="goDocs('estimate')"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h6M9.5 15.5h6"/></svg><span>Estimates</span></button>
  <button class="bb-btn" data-bb="invoices" onclick="goDocs('invoice')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 6.8v10.4M15 8.6c-.7-.9-1.7-1.3-3-1.3-1.9 0-3.2 1-3.2 2.4 0 3.3 6.4 1.8 6.4 4.6 0 1.4-1.4 2.4-3.2 2.4-1.4 0-2.5-.5-3.2-1.4"/></svg><span>Invoices</span></button>
  <button class="bb-new" onclick="toggleSheet('sheetNew')" aria-label="New document">+</button>
  <button class="bb-btn" data-bb="clients" onclick="go('clients')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/></svg><span>Clients</span></button>
  <button class="bb-btn" data-bb="more" onclick="toggleSheet('sheetMore')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg><span>More</span></button>
