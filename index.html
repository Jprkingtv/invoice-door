<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPR KING Invoicing</title>
<meta http-equiv="refresh" content="2; url=https://muse.ai/library/artifacts/jprauto-invoicing">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;color:#f5eeda;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(1200px 600px at 50% -10%,#1b2f63 0%,#0a1633 55%,#060d22 100%);padding:22px}
.card{max-width:560px;width:100%;border:2px solid #d4af37;border-radius:20px;padding:34px 24px 28px;background:linear-gradient(180deg,rgba(212,175,55,.10),rgba(10,22,51,.65) 40%);box-shadow:0 0 44px rgba(212,175,55,.28),inset 0 0 60px rgba(0,0,0,.45);animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
img.logo{width:190px;height:190px;object-fit:cover;border-radius:16px;border:2px solid #d4af37;box-shadow:0 0 26px rgba(212,175,55,.45)}
h1{color:#d4af37;letter-spacing:3px;font-size:32px;margin:18px 0 6px;text-shadow:0 2px 14px rgba(212,175,55,.35)}
.sub{font-size:16px;letter-spacing:1px;opacity:.92;margin:4px 0}
.opening{font-size:18px;margin:16px 0 4px}
a.btn{display:inline-block;margin-top:16px;background:linear-gradient(180deg,#f0cd55,#c39a2b);color:#0a1633;font-weight:bold;font-size:20px;letter-spacing:1px;padding:16px 38px;border-radius:12px;text-decoration:none;box-shadow:0 6px 22px rgba(212,175,55,.45);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 22px rgba(212,175,55,.45)}50%{box-shadow:0 6px 30px rgba(212,175,55,.8)}}
.small{font-size:13.5px;opacity:.8;margin-top:24px;line-height:1.6}
.motto{color:#d4af37;font-weight:bold;letter-spacing:2px;margin-top:10px;font-size:15px}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="logo.jpg" alt="JPR KING — Sales, Auto Repair, Autobody">
<h1>JPR KING INVOICING</h1>
<p class="sub">SALES &bull; AUTO REPAIR &bull; AUTOBODY &mdash; FORT LAUDERDALE</p>
<p class="opening">Opening your invoicing app&hellip;</p>
<a class="btn" href="https://muse.ai/library/artifacts/jprauto-invoicing">OPEN JPR KING INVOICING</a>
<p class="small">837 NW 8th Ave, Fort Lauderdale, FL 33311<br>(941) 270-4988 &mdash; ask for JAY</p>
<p class="motto">GOD IS GOOD ALL THE TIME</p>
</div>
<script>setTimeout(function(){location.replace("https://muse.ai/library/artifacts/jprauto-invoicing")},1800);</script>
</body>
</html>
